name: Prepare or publish project site

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the reviewed artifact to the configured GitHub Pages environment
        type: boolean
        required: true
        default: false
      release_tag:
        description: Published release tag to verify and deploy (required for publication)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ingenium-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a release for publication
        if: inputs.deploy && !inputs.release_tag
        run: |
          echo 'Publishing requires an explicit published release_tag.' >&2
          exit 1
      - name: Download the published release
        if: inputs.release_tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p work/published-release
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft > work/release-info.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir work/published-release
          node tools/verify-release-source.mjs work/published-release/artifacts.json "$RELEASE_TAG" work/release-info.json
      - name: Stage authored site and verify local references and release bytes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            node tools/build-release-site.mjs work/pages-site work/published-release/artifacts.json
          else
            node tools/build-release-site.mjs work/pages-site
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: work/pages-site

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v4
