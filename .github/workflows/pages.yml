name: Prepare or publish project site

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the reviewed artifact to the configured GitHub Pages environment
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ingenium-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage authored site and verify local references
        run: node tools/build-release-site.mjs work/pages-site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: work/pages-site

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v4
