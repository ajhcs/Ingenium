<circle cx="44" cy="144" r="16" fill="#DEE7D9" stroke="#294E40" stroke-width="1.5"/><text x="44" y="149" text-anchor="middle" font-size="15" font-weight="600">1</text><text x="76" y="151" font-size="23" font-weight="600">Library</text><circle cx="44" cy="244" r="16" fill="#DEE7D9" stroke="#294E40" stroke-width="1.5"/><text x="44" y="249" text-anchor="middle" font-size="15" font-weight="600">2</text><text x="76" y="251" font-size="23" font-weight="600">Tool Shed</text><circle cx="44" cy="344" r="16" fill="#DEE7D9" stroke="#294E40" stroke-width="1.5"/><text x="44" y="349" text-anchor="middle" font-size="15" font-weight="600">3</text><text x="76" y="351" font-size="23" font-weight="600">Greenhouse</text>
<text x="76" y="195" font-size="17">12 minutes</text>
