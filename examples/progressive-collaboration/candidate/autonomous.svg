<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title description">
  <title id="title">Seed Swap walking route</title>
  <desc id="description">Start at Library. Walk 12 minutes to Tool Shed, then 8 minutes to Greenhouse. Total walking time: 20 minutes. Numbered stops show the route order; this is not a geographic map.</desc>
  <rect width="600" height="720" fill="#FAF7EF"/>
  <rect x="20" y="20" width="560" height="680" rx="24" fill="none" stroke="#244B3C" stroke-width="1.5"/>
  <g font-family="sans-serif" fill="#244B3C">
    <text x="48" y="65" font-size="17" font-weight="600">WELCOME TO THE</text>
    <text id="heading" x="46" y="119" font-size="46" font-weight="700">Seed Swap</text>
    <text x="48" y="155" font-size="21">Your walking route</text>
    <rect x="395" y="123" width="157" height="44" rx="22" fill="#EAD081"/>
    <text x="473.5" y="151" text-anchor="middle" font-size="18" font-weight="600">20 min total</text>
    <path d="M48 191H552" fill="none" stroke="#244B3C" stroke-opacity="0.28"/>
    <g id="route" stroke="#244B3C" stroke-width="3" fill="none">
      <path d="M82 288V390 M76 382L82 390L88 382"/>
      <path d="M82 442V544 M76 536L82 544L88 536"/>
    </g>
    <g id="first-stop">
      <circle cx="82" cy="264" r="24" fill="#EAD081"/>
      <text x="82" y="272" text-anchor="middle" font-size="22" font-weight="700">1</text>
      <text id="library" x="132" y="262" font-size="30" font-weight="700">Library</text>
      <text x="132" y="291" font-size="18">Start here</text>
    </g>
    <g id="first-leg">
      <rect x="132" y="321" width="156" height="38" rx="19" fill="#E4EBDF"/>
      <text x="210" y="346" text-anchor="middle" font-size="18">12 minutes</text>
    </g>
    <g id="second-stop">
      <circle cx="82" cy="418" r="24" fill="#EAD081"/>
      <text x="82" y="426" text-anchor="middle" font-size="22" font-weight="700">2</text>
      <text id="shed" x="132" y="416" font-size="30" font-weight="700">Tool Shed</text>
      <text x="132" y="445" font-size="18">Next stop</text>
    </g>
    <g id="second-leg">
      <rect x="132" y="475" width="156" height="38" rx="19" fill="#E4EBDF"/>
      <text x="210" y="500" text-anchor="middle" font-size="18">8 minutes</text>
    </g>
    <g id="third-stop">
      <circle cx="82" cy="572" r="24" fill="#EAD081"/>
      <text x="82" y="580" text-anchor="middle" font-size="22" font-weight="700">3</text>
      <text id="greenhouse" x="132" y="570" font-size="30" font-weight="700">Greenhouse</text>
      <text x="132" y="599" font-size="18">You’ve arrived</text>
    </g>
    <path d="M48 638H552" fill="none" stroke="#244B3C" stroke-opacity="0.28"/>
    <text x="48" y="670" font-size="17">Follow the numbered stops in order.</text>
  </g>
</svg>
