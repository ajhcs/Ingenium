<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480"><title>Seed Swap — bookish lettering</title><desc>Walking route: Library to Tool Shed, 12 minutes; Tool Shed to Greenhouse, 8 minutes. Total walking time: 20 minutes. Layout study; the line shows order, not geography.</desc>
<rect width="360" height="480" rx="16" fill="#F6F3E9"/>
<g fill="#40533C">
<text x="28" y="43" font-family="sans-serif" font-size="13">WALKING ROUTE</text>
<text x="28" y="87" font-family="serif" font-size="39">Seed Swap</text>
<text x="28" y="116" font-family="sans-serif" font-size="15">A little walk between stops</text>
</g>
<path d="M47 163 V368" fill="none" stroke="#92A287" stroke-width="2"/>
<g font-family="sans-serif" font-size="12" text-anchor="middle" fill="#40533C" stroke="#40533C">
<circle cx="47" cy="163" r="18" fill="#F6F3E9"/><circle cx="47" cy="266" r="18" fill="#F6F3E9"/><circle cx="47" cy="369" r="18" fill="#E0E8D8"/>
<g stroke="none"><text x="47" y="167">1</text><text x="47" y="270">2</text><text x="47" y="373">3</text></g>
</g>
<g fill="#40533C" font-family="sans-serif">
<text x="82" y="170" font-size="25" font-family="serif">Library</text>
<text x="82" y="218" font-size="16">↓ 12 minutes walking</text>
<text x="82" y="273" font-size="25" font-family="serif">Tool Shed</text>
<text x="82" y="321" font-size="16">↓ 8 minutes walking</text>
<text x="82" y="376" font-size="25" font-family="serif">Greenhouse</text>
<path d="M28 414 H332" stroke="#C9D1BF"/>
<text x="28" y="445" font-size="15">20 minutes walking altogether</text>
</g></svg>