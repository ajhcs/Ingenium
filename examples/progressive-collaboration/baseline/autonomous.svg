<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title description">
  <title id="title">Seed Swap walking route</title>
  <desc id="description">Start at Library. Walk to Tool Shed in 12 minutes, then to Greenhouse in 8 minutes. Total walking time: 20 minutes. The diagram shows stop order rather than geographic directions.</desc>
  <rect id="paper" width="760" height="480" rx="24" fill="#F7F5ED"/>
  <g id="header" fill="#244C55" font-family="sans-serif">
    <text x="40" y="48" font-size="14" font-weight="600">YOUR WALKING ROUTE</text>
    <text x="40" y="102" font-size="46" font-weight="700">Seed Swap</text>
    <text x="40" y="138" font-size="18">A short walk between three stops</text>
  </g>
  <g id="seed-mark" transform="translate(664 79)" fill="#C99945">
    <ellipse cx="-11" cy="0" rx="12" ry="23" transform="rotate(-32 -11 0)"/>
    <ellipse cx="13" cy="-5" rx="12" ry="23" transform="rotate(32 13 -5)"/>
  </g>
  <g id="walking-times" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#244C55">
    <rect x="178" y="184" width="144" height="40" rx="20" fill="#E2EDE7"/>
    <text x="250" y="210">12 minutes</text>
    <rect x="438" y="184" width="144" height="40" rx="20" fill="#E2EDE7"/>
    <text x="510" y="210">8 minutes</text>
  </g>
  <g id="route-lines" fill="none" stroke="#53776E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path id="library-to-tool-shed" d="M150 260H347M337 252L347 260L337 268"/>
    <path id="tool-shed-to-greenhouse" d="M410 260H607M597 252L607 260L597 268"/>
  </g>
  <g id="stop-numbers" fill="#244C55" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <circle cx="120" cy="260" r="26" fill="#E2EDE7"/>
    <circle cx="380" cy="260" r="26" fill="#E2EDE7"/>
    <circle cx="640" cy="260" r="26" fill="#E2EDE7"/>
    <text x="120" y="267">1</text>
    <text x="380" y="267">2</text>
    <text x="640" y="267">3</text>
  </g>
  <g id="stop-names" fill="#244C55" font-family="sans-serif" font-size="25" font-weight="600" text-anchor="middle">
    <text x="120" y="321">Library</text>
    <text x="380" y="321">Tool Shed</text>
    <text x="640" y="321">Greenhouse</text>
  </g>
  <g id="stop-guidance" fill="#244C55" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="120" y="351">Start here</text>
    <text x="380" y="351">Next stop</text>
    <text x="640" y="351">Finish here</text>
  </g>
  <g id="total-time" font-family="sans-serif" fill="#244C55">
    <rect x="40" y="393" width="680" height="55" rx="12" fill="#E2EDE7"/>
    <text x="380" y="428" text-anchor="middle" font-size="20">20 minutes walking altogether</text>
  </g>
</svg>
