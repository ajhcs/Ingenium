<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000"><title>ALT — Identity standards - reopened hybrid composition 2</title><rect x="0" y="0" width="760" height="1000" fill="#fff" stroke="none" stroke-width="1" rx="0" /><text x="44" y="80" font-family="Arial" font-size="25" font-weight="400" fill="#222">01   The mark</text><text x="44" y="157" font-family="Arial" font-size="17" font-weight="400" fill="#222">Use the master geometry. Keep it whole.</text><text x="83" y="440" font-family="Arial" font-size="143" font-weight="400" fill="#888">A L T</text><path d="M66 250L66 499M693 248V502M58 501H703" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 7" /><text x="44" y="654" font-family="Arial" font-size="25" font-weight="400" fill="#222">One stem unit</text><text x="44" y="698" font-family="Arial" font-size="17" font-weight="400" fill="#222">The vertical stem is the unit u. Keep at</text><text x="44" y="723" font-family="Arial" font-size="17" font-weight="400" fill="#222">least one u of clear space on every side of</text><text x="44" y="748" font-family="Arial" font-size="17" font-weight="400" fill="#222">the mark.</text><text x="402" y="698" font-family="Arial" font-size="17" font-weight="400" fill="#222">The master mark is 304 units</text><text x="402" y="723" font-family="Arial" font-size="17" font-weight="400" fill="#222">wide and 100 units high. Do not</text><text x="402" y="748" font-family="Arial" font-size="17" font-weight="400" fill="#222">stretch the letters, close the</text><text x="402" y="773" font-family="Arial" font-size="17" font-weight="400" fill="#222">counter or separate the three</text><text x="402" y="798" font-family="Arial" font-size="17" font-weight="400" fill="#222">forms.</text><text x="44" y="859" font-family="Arial" font-size="16" font-weight="400" fill="#222">Minimum printed width: 24 mm</text><text x="402" y="859" font-family="Arial" font-size="15" font-weight="400" fill="#666">Use vector artwork at every size.</text><text x="44" y="963" font-family="Arial" font-size="10" font-weight="400" fill="#222">ATMOSPHERIC LISTENING TRUST</text></svg>