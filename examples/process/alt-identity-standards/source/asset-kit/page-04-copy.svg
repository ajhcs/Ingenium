<svg xmlns="http://www.w3.org/2000/svg" width="760.0" height="1000.0" viewBox="0 0 760.0 1000.0"><title>Reading copy and labels</title><style>@font-face{font-family:"IBM Plex Mono";src:url('../../../fonts/google-ibmplexmono-normal/font.ttf') format("truetype");font-style:normal;font-weight:400;font-display:block;}@font-face{font-family:"IBM Plex Sans";src:url('../../../fonts/google-ibmplexsans-normal/font.ttf') format("truetype");font-style:normal;font-weight:100 700;font-display:block;}@font-face{font-family:"Space Grotesk";src:url('../../../fonts/google-spacegrotesk-normal/font.ttf') format("truetype");font-style:normal;font-weight:300 700;font-display:block;}</style><text x="77" y="58" font-family="IBM Plex Sans" font-size="13" font-weight="700" fill="#222" letter-spacing=".045em">ALT / IDENTITY STANDARDS</text><text x="573" y="58" font-family="IBM Plex Sans" font-size="12" font-weight="400" fill="#222" letter-spacing=".045em">FIELD EDITION 01</text><text x="44" y="138" font-family="IBM Plex Sans" font-size="14" font-weight="700" fill="#f04d24">03</text><text x="44" y="182" font-family="IBM Plex Sans" font-size="18" font-weight="400" fill="#121b22">An identification system that survives a busy surface.</text><text x="106" y="487" font-family="IBM Plex Sans" font-size="24" font-weight="700" fill="#121b22">AIR LOGGER 04</text><text x="106" y="521" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#68747a" letter-spacing=".045em">FIELD OPERATIONS / ALT-004</text><text x="67" y="778" font-family="IBM Plex Sans" font-size="22" font-weight="600" fill="#121b22">ASSET ALT-004</text><text x="67" y="811" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#121b22">Return to field operations</text><text x="67" y="834" font-family="IBM Plex Sans" font-size="12" font-weight="400" fill="#68747a">alt.example / field</text><text x="402" y="706" font-family="IBM Plex Sans" font-size="25" font-weight="500" fill="#121b22">Identification first</text><text x="402" y="746" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">Place the mark where it can be</text><text x="402" y="771" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">seen before handling. Keep</text><text x="402" y="796" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">controls, vents and service</text><text x="402" y="821" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">access outside its clear space.</text><text x="44" y="902" font-family="IBM Plex Sans" font-size="12" font-weight="400" fill="#68747a">Illustrative enclosure, not an engineered product.</text></svg>