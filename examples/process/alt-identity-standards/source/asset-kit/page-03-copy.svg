<svg xmlns="http://www.w3.org/2000/svg" width="760.0" height="1000.0" viewBox="0 0 760.0 1000.0"><title>Reading copy and labels</title><style>@font-face{font-family:"IBM Plex Mono";src:url('../../../fonts/google-ibmplexmono-normal/font.ttf') format("truetype");font-style:normal;font-weight:400;font-display:block;}@font-face{font-family:"IBM Plex Sans";src:url('../../../fonts/google-ibmplexsans-normal/font.ttf') format("truetype");font-style:normal;font-weight:100 700;font-display:block;}@font-face{font-family:"Space Grotesk";src:url('../../../fonts/google-spacegrotesk-normal/font.ttf') format("truetype");font-style:normal;font-weight:300 700;font-display:block;}</style><text x="77" y="58" font-family="IBM Plex Sans" font-size="13" font-weight="700" fill="#222" letter-spacing=".045em">ALT / IDENTITY STANDARDS</text><text x="573" y="58" font-family="IBM Plex Sans" font-size="12" font-weight="400" fill="#222" letter-spacing=".045em">FIELD EDITION 01</text><text x="44" y="138" font-family="IBM Plex Sans" font-size="14" font-weight="700" fill="#f04d24">02</text><text x="44" y="182" font-family="IBM Plex Sans" font-size="18" font-weight="400" fill="#121b22">One signal accent. A quiet working field.</text><text x="44" y="409" font-family="IBM Plex Sans" font-size="15" font-weight="700" fill="#121b22">INK</text><text x="44" y="436" font-family="IBM Plex Sans" font-size="14" font-weight="400" fill="#68747a" letter-spacing=".045em">#121B22</text><text x="274" y="409" font-family="IBM Plex Sans" font-size="15" font-weight="700" fill="#121b22" letter-spacing=".045em">SIGNAL</text><text x="274" y="436" font-family="IBM Plex Sans" font-size="14" font-weight="400" fill="#68747a" letter-spacing=".045em">#F04D24</text><text x="504" y="409" font-family="IBM Plex Sans" font-size="15" font-weight="700" fill="#121b22" letter-spacing=".045em">PAPER</text><text x="504" y="436" font-family="IBM Plex Sans" font-size="14" font-weight="400" fill="#68747a" letter-spacing=".045em">#F6F3EC</text><text x="44" y="688" font-family="IBM Plex Sans" font-size="18" font-weight="600" fill="#121b22">Default</text><text x="274" y="688" font-family="IBM Plex Sans" font-size="18" font-weight="600" fill="#121b22">Reverse</text><text x="504" y="688" font-family="IBM Plex Sans" font-size="18" font-weight="600" fill="#121b22">Signal</text><text x="44" y="738" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">Use ink for body copy</text><text x="44" y="763" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">and dense information.</text><text x="44" y="788" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">Keep a calm field around</text><text x="44" y="813" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">the mark.</text><text x="274" y="738" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">Reverse the mark only on</text><text x="274" y="763" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">an ink field. Use signal</text><text x="274" y="788" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">for a single lead mark</text><text x="274" y="813" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">or a small section cue.</text><text x="504" y="738" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">Do not place the mark</text><text x="504" y="763" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">over a detailed data</text><text x="504" y="788" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">field. The information</text><text x="504" y="813" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">and identity each need</text><text x="504" y="838" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">room.</text></svg>