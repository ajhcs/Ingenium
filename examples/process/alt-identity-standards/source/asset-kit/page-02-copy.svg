<svg xmlns="http://www.w3.org/2000/svg" width="760.0" height="1000.0" viewBox="0 0 760.0 1000.0"><title>Reading copy and labels</title><style>@font-face{font-family:"IBM Plex Mono";src:url('../../../fonts/google-ibmplexmono-normal/font.ttf') format("truetype");font-style:normal;font-weight:400;font-display:block;}@font-face{font-family:"IBM Plex Sans";src:url('../../../fonts/google-ibmplexsans-normal/font.ttf') format("truetype");font-style:normal;font-weight:100 700;font-display:block;}@font-face{font-family:"Space Grotesk";src:url('../../../fonts/google-spacegrotesk-normal/font.ttf') format("truetype");font-style:normal;font-weight:300 700;font-display:block;}</style><text x="77" y="58" font-family="IBM Plex Sans" font-size="13" font-weight="700" fill="#222" letter-spacing=".045em">ALT / IDENTITY STANDARDS</text><text x="573" y="58" font-family="IBM Plex Sans" font-size="12" font-weight="400" fill="#222" letter-spacing=".045em">FIELD EDITION 01</text><text x="44" y="138" font-family="IBM Plex Sans" font-size="14" font-weight="700" fill="#f04d24">01</text><text x="44" y="182" font-family="IBM Plex Sans" font-size="18" font-weight="400" fill="#121b22">Use the master geometry. Keep it whole.</text><text x="104" y="580.0" font-family="IBM Plex Sans" font-size="15" font-weight="600" fill="#f04d24">u</text><text x="44" y="698" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">The vertical stem is the unit u. Keep at</text><text x="44" y="723" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">least one u of clear space on every side of</text><text x="44" y="748" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">the mark.</text><text x="402" y="698" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">The master mark is 304 units</text><text x="402" y="723" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">wide and 100 units high. Do not</text><text x="402" y="748" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">stretch the letters, close the</text><text x="402" y="773" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">counter or separate the three</text><text x="402" y="798" font-family="IBM Plex Sans" font-size="17" font-weight="400" fill="#121b22">forms.</text><text x="44" y="859" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#121b22">Minimum printed width: 24 mm</text><text x="402" y="859" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#68747a">Use vector artwork at every size.</text></svg>