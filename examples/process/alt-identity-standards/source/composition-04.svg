<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000"><title>ALT — Identity standards - reopened hybrid composition 4</title><rect x="0" y="0" width="760" height="1000" fill="#fff" stroke="none" stroke-width="1" rx="0" /><text x="44" y="80" font-family="Arial" font-size="25" font-weight="400" fill="#222">03   Field equipment</text><text x="44" y="157" font-family="Arial" font-size="17" font-weight="400" fill="#222">An identification system that survives a busy surface.</text><path d="M55 260L687 257L685 590L58 588ZM76 282L665 280L665 565L78 568" fill="none" stroke="#888" stroke-width="2" /><text x="105" y="411" font-family="Arial" font-size="90" font-weight="400" fill="#888">ALT</text><text x="106" y="487" font-family="Arial" font-size="22" font-weight="400" fill="#222">AIR LOGGER 04</text><text x="106" y="521" font-family="Arial" font-size="13" font-weight="400" fill="#666">FIELD OPERATIONS / ALT-004</text><path d="M507 315L602 317" fill="none" stroke="#aaa" stroke-width="2" /><path d="M507 340L602 342" fill="none" stroke="#aaa" stroke-width="2" /><path d="M507 365L602 367" fill="none" stroke="#aaa" stroke-width="2" /><path d="M507 390L602 392" fill="none" stroke="#aaa" stroke-width="2" /><path d="M507 415L602 417" fill="none" stroke="#aaa" stroke-width="2" /><rect x="44" y="686" width="298" height="172" fill="none" stroke="#bbb" stroke-width="1" rx="0" /><text x="67" y="743" font-family="Arial" font-size="31" font-weight="400" fill="#888">ALT</text><text x="67" y="778" font-family="Arial" font-size="20" font-weight="400" fill="#222">ASSET ALT-004</text><text x="67" y="811" font-family="Arial" font-size="15" font-weight="400" fill="#222">Return to field operations</text><text x="67" y="834" font-family="Arial" font-size="12" font-weight="400" fill="#666">alt.example / field</text><text x="402" y="706" font-family="Arial" font-size="23" font-weight="400" fill="#222">Identification first</text><text x="402" y="746" font-family="Arial" font-size="17" font-weight="400" fill="#222">Place the mark where it can be</text><text x="402" y="771" font-family="Arial" font-size="17" font-weight="400" fill="#222">seen before handling. Keep</text><text x="402" y="796" font-family="Arial" font-size="17" font-weight="400" fill="#222">controls, vents and service</text><text x="402" y="821" font-family="Arial" font-size="17" font-weight="400" fill="#222">access outside its clear space.</text><text x="44" y="902" font-family="Arial" font-size="12" font-weight="400" fill="#666">Illustrative enclosure, not an engineered product.</text><text x="44" y="963" font-family="Arial" font-size="10" font-weight="400" fill="#222">ATMOSPHERIC LISTENING TRUST</text></svg>