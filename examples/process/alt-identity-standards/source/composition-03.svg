<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000"><title>ALT — Identity standards - reopened hybrid composition 3</title><rect x="0" y="0" width="760" height="1000" fill="#fff" stroke="none" stroke-width="1" rx="0" /><text x="44" y="80" font-family="Arial" font-size="25" font-weight="400" fill="#222">02   Color and use</text><text x="44" y="157" font-family="Arial" font-size="17" font-weight="400" fill="#222">One signal accent. A quiet working field.</text><text x="44" y="267" font-family="Arial" font-size="24" font-weight="400" fill="#222">INK</text><text x="44" y="301" font-family="Arial" font-size="14" font-weight="400" fill="#666">#121B22</text><path d="M44 337L224 337" fill="none" stroke="#aaa" stroke-width="1" /><text x="274" y="267" font-family="Arial" font-size="24" font-weight="400" fill="#222">SIGNAL</text><text x="274" y="301" font-family="Arial" font-size="14" font-weight="400" fill="#666">#F04D24</text><path d="M274 337L454 337" fill="none" stroke="#aaa" stroke-width="1" /><text x="504" y="267" font-family="Arial" font-size="24" font-weight="400" fill="#222">PAPER</text><text x="504" y="301" font-family="Arial" font-size="14" font-weight="400" fill="#666">#F6F3EC</text><path d="M504 337L684 337" fill="none" stroke="#aaa" stroke-width="1" /><text x="54" y="600" font-family="Arial" font-size="44" font-weight="400" fill="#888">A L T</text><text x="44" y="688" font-family="Arial" font-size="18" font-weight="400" fill="#222">Default</text><text x="284" y="600" font-family="Arial" font-size="44" font-weight="400" fill="#888">A L T</text><text x="274" y="688" font-family="Arial" font-size="18" font-weight="400" fill="#222">Reverse</text><text x="514" y="600" font-family="Arial" font-size="44" font-weight="400" fill="#888">A L T</text><text x="504" y="688" font-family="Arial" font-size="18" font-weight="400" fill="#222">Signal</text><text x="44" y="738" font-family="Arial" font-size="17" font-weight="400" fill="#222">Use ink for body copy</text><text x="44" y="763" font-family="Arial" font-size="17" font-weight="400" fill="#222">and dense information.</text><text x="44" y="788" font-family="Arial" font-size="17" font-weight="400" fill="#222">Keep a calm field around</text><text x="44" y="813" font-family="Arial" font-size="17" font-weight="400" fill="#222">the mark.</text><text x="274" y="738" font-family="Arial" font-size="17" font-weight="400" fill="#222">Reverse the mark only on</text><text x="274" y="763" font-family="Arial" font-size="17" font-weight="400" fill="#222">an ink field. Use signal</text><text x="274" y="788" font-family="Arial" font-size="17" font-weight="400" fill="#222">for a single lead mark</text><text x="274" y="813" font-family="Arial" font-size="17" font-weight="400" fill="#222">or a small section cue.</text><text x="504" y="738" font-family="Arial" font-size="17" font-weight="400" fill="#222">Do not place the mark</text><text x="504" y="763" font-family="Arial" font-size="17" font-weight="400" fill="#222">over a detailed data</text><text x="504" y="788" font-family="Arial" font-size="17" font-weight="400" fill="#222">field. The information</text><text x="504" y="813" font-family="Arial" font-size="17" font-weight="400" fill="#222">and identity each need</text><text x="504" y="838" font-family="Arial" font-size="17" font-weight="400" fill="#222">room.</text><text x="44" y="963" font-family="Arial" font-size="10" font-weight="400" fill="#222">ATMOSPHERIC LISTENING TRUST</text></svg>