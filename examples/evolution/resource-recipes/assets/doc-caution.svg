<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"><title>Caution panel</title><desc>Signal word and bounded instruction; original synthetic example.</desc><rect width="800" height="400" fill="#f7f9f9"/><g fill="#172f3c" font-family="sans-serif"><rect x="40" y="65" width="720" height="159" rx="4" fill="#fff8f0" stroke="#90B6CB"/><path d="M40 65 H760 V127 H40 Z" fill="#DA5C18"/><text x="65" y="100" font-size="20" fill="#fff" font-weight="700"><tspan x="65" dy="0">CAUTION</tspan></text><text x="65" y="167" font-size="20" ><tspan x="65" dy="0">Disconnect the supply before inspection.</tspan></text></g></svg>
