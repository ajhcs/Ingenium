<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"><title>Two inputs to one receiver</title><desc>Two independent sources feed one receiver; original synthetic example.</desc><rect width="800" height="400" fill="#f7f9f9"/><g fill="#172f3c" font-family="sans-serif"><path d="M255 110 L555 195" fill="none" stroke="#DA5C18" stroke-width="2"/><path d="M544.015719874566 197.08460790701665 L555 195 L546.7417455991263 187.46334064386284" fill="none" stroke="#DA5C18" stroke-width="2"/><text x="405" y="142.5" font-size="14" text-anchor="middle">signal A</text><path d="M255 275 L555 195" fill="none" stroke="#DA5C18" stroke-width="2"/><path d="M546.6259638567892 202.40780120360955 L555 195 L544.0493373511858 192.74545180759708" fill="none" stroke="#DA5C18" stroke-width="2"/><text x="405" y="225" font-size="14" text-anchor="middle">signal B</text><rect x="55" y="65" width="200" height="90" rx="4" fill="#fff" stroke="#90B6CB"/><text x="155" y="117" font-size="18" text-anchor="middle">Input A</text><rect x="55" y="230" width="200" height="90" rx="4" fill="#fff" stroke="#90B6CB"/><text x="155" y="282" font-size="18" text-anchor="middle">Input B</text><rect x="565" y="150" width="200" height="90" rx="4" fill="#fff" stroke="#90B6CB"/><text x="665" y="202" font-size="18" text-anchor="middle">Receiver</text></g></svg>
