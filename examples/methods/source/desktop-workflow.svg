width="95" height="26" rx="13" fill="#eaf0f9" stroke="#eaf0f9"/><text x="197" y="233" font-family="sans-serif" font-size="12" font-weight="600" fill="#315f9b">3 open</text><rect x="68" y="251" width="220" height="79" rx="6" fill="#eaf0f9" stroke="#315f9b"/><text x="82" y="274" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">R-1048</text><text x="82" y="299" font-family="sans-serif" font-size="15" font-weight="600" fill="#23313b">Bench lamp</text><text x="82" y="318" font-family="sans-serif" font-size="12" font-weight="400" fill="#63727c">Ready</text><rect x="68" y="342" width="220" height="79" rx="6" fill="#ffffff" stroke="#d8e0e5"/><text x="82" y="365" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">R-1047</text><text x="82" y="390" font-family="sans-serif" font-size="15" font-weight="600" fill="#23313b">City bicycle</text><text x="82" y="409" font-family="sans-serif" font-size="12" font-weight="400" fill="#63727c">In progress</text><rect x="68" y="433" width="220" height="79" rx="6" fill="#ffffff" stroke="#d8e0e5"/><text x="82" y="456" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">R-1046</text><text x="82" y="481" font-family="sans-serif" font-size="15" font-weight="600" fill="#23313b">Desk fan</text><text x="82" y="500" font-family="sans-serif" font-size="12" font-weight="400" fill="#63727c">In progress</text><text x="322" y="237" font-family="sans-serif" font-size="25" font-weight="600" fill="#23313b">Bench lamp</text><rect x="656" y="214" width="94" height="26" rx="13" fill="#e8f3ef" stroke="#e8f3ef"/><text x="668" y="232" font-family="sans-serif" font-size="12" font-weight="600" fill="#15776d">Ready</text><text x="322" y="265" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">R-1048 · RECEIVED TODAY</text><line x1="322" y1="284" x2="766" y2="284" stroke="#d8e0e5" stroke-width="1"/><text x="322" y="316" font-family="sans-serif" font-size="14" font-weight="600" fill="#23313b">Reported issue</text><text x="322" y="343" font-family="sans-serif" font-size="14" font-weight="400" fill="#23313b">Switch moves freely; lamp stays off.</text><text x="322" y="384" font-family="sans-serif" font-size="14" font-weight="600" fill="#23313b">Service note</text><rect x="322" y="399" width="440" height="72" rx="6" fill="#f5f7f8" stroke="#d8e0e5"/><text x="336" y="425" font-family="sans-serif" font-size="14" font-weight="400" fill="#63727c">Inspect switch housing before service.</text><g><rect x="322" y="498" width="136" height="36" rx="6" fill="#ffffff" stroke="#d8e0e5"/><text x="336" y="522" font-family="sans-serif" font-size="13" font-weight="600" fill="#23313b">Save note</text></g><text x="478" y="522" font-family="sans-serif" font-size="12" font-weight="400" fill="#63727c">Note session · local raw draft</text><line x1="790" y1="203" x2="790" y2="580" stroke="#d8e0e5" stroke-width="1"/><text x="814" y="237" font-family="sans-serif" font-size="20" font-weight="600" fill="#23313b">Assignment</text><text x="814" y="258" font-family="sans-serif" font-size="12" font-weight="400" fill="#63727c">R-1048 · Bench lamp</text><text x="814" y="279" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">PERSON</text><rect x="814" y="292" width="306" height="40" rx="6" fill="#ffffff" stroke="#d8e0e5"/><text x="828" y="318" font-family="sans-serif" font-size="14" font-weight="400" fill="#23313b">Mina? · invalid draft</text><text x="814" y="363" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">PLANNED DATE</text><rect x="814" y="376" width="306" height="40" rx="6" fill="#ffffff" stroke="#d8e0e5"/><text x="828" y="402" font-family="sans-serif" font-size="14" font-weight="400" fill="#23313b">Tomorrow</text><g><rect x="814" y="498" width="306" height="36" rx="6" fill="#315f9b" stroke="#315f9b"/><text x="828" y="522" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Assign work order</text></g><rect x="56" y="600" width="1088" height="104" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="72" y="624" font-family="sans-serif" font-size="12" font-weight="600" fill="#315f9b">EVENT TRACE / SHARED ASSIGNMENT EDIT SESSION · PROPOSED AUTOMATIC VALID UPDATES</text><text x="72" y="650" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">1 Select R-1048 → queue + detail show valid r1; focus enters inspector.</text><text x="72" y="672" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">2 Type Mina? → raw draft retained in inspector; linked views keep valid r1.</text><text x="650" y="650" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">3 Move panes → transfer same draft/session; restore field focus.</text><text x="650" y="672" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">4 Repair → auto r2; valid views refresh; save request may be pending.</text></g><line x1="56" y1="737" x2="1144" y2="737" stroke="#bdc4b6" stroke-width="1"/><text x="56" y="765" font-family="sans-serif" font-size="12" font-weight="400" fill="#545e55">Selection change retains drafts by subject/field; focus restoration, request freshness and resizing are untested.</text><text x="1045" y="765" font-family="sans-serif" font-size="12" font-weight="600" fill="#545e55">INGENIUM</text></svg>
