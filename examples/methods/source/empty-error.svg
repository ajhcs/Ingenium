<svg id="empty-error-scene" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title id="empty-error-title">Empty and error states</title><desc id="empty-error-description">Explain the condition, preserve context, and provide a useful next action Subject R-1048: Bench lamp. Original synthetic Relay study. Editable source, not a working product.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f2f0e8" stroke="#f2f0e8"/><rect x="56" y="29" width="12" height="16" rx="0" fill="#e5ff55" stroke="#202824"/><text x="79" y="43" font-family="sans-serif" font-size="12" font-weight="600" fill="#202824">INGENIUM / RELAY STUDIES</text><g id="empty-error-subject-title"><title id="empty-error-subject-title-full">R-1048 / Bench lamp</title><text id="empty-error-subject-title-visible" x="560" y="43" font-family="sans-serif" font-size="12" font-weight="400" fill="#545e55">R-1048 / Bench lamp</text></g><line x1="56" y1="57" x2="1144" y2="57" stroke="#bdc4b6" stroke-width="1"/><text x="56" y="96" font-family="DejaVuSerif, Georgia, serif" font-size="34" font-weight="400" fill="#202824">Empty and error states</text><text x="56" y="125" font-family="sans-serif" font-size="15" font-weight="400" fill="#545e55">Explain the condition, preserve context, and provide a useful next action</text><g id="empty-error-view"><text x="56" y="171" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">A / FIRST USE · NO ORDERS</text><text x="614" y="171" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">B / REQUEST FAILED · CONTENT RETAINED</text><rect x="56" y="190" width="530" height="370" rx="10" fill="#ffffff" stroke="#d8e0e5"/><rect x="614" y="190" width="530" height="370" rx="10" fill="#ffffff" stroke="#d8e0e5"/><rect x="281" y="237" width="80" height="65" rx="12" fill="#eaf0f9" stroke="#eaf0f9"/><line x1="301" y1="260" x2="341" y2="260" stroke="#315f9b" stroke-width="2"/><line x1="301" y1="276" x2="331" y2="276" stroke="#315f9b" stroke-width="2"/><text x="173" y="345" font-family="sans-serif" font-size="24" font-weight="600" fill="#23313b">Your queue starts here</text><text x="138" y="378" font-family="sans-serif" font-size="14" font-weight="400" fill="#63727c">Create a work order to coordinate the next repair.</text><g><rect x="221" y="414" width="200" height="36" rx="6" fill="#315f9b" stroke="#315f9b"/><text x="235" y="438" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Create work order</text></g><text x="196" y="489" font-family="sans-serif" font-size="13" font-weight="400" fill="#63727c">No records yet · no filters applied</text><text x="638" y="227" font-family="sans-serif" font-size="23" font-weight="600" fill="#23313b">Assign R-1048</text><text x="638" y="270" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">ASSIGNEE</text><rect x="638" y="284" width="482" height="42" rx="6" fill="#f5f7f8" stroke="#d8e0e5"/><text x="653" y="312" font-family="sans-serif" font-size="15" font-weight="400" fill="#23313b">Mina Patel</text><rect x="638" y="347" width="482" height="99" rx="8" fill="#fff2dc" stroke="#fff2dc"/><text x="654" y="376" font-family="sans-serif" font-size="17" font-weight="600" fill="#946018">Assignment could not be saved</text><text x="654" y="401" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Connection interrupted. Your selection is still here.</text><text x="654" y="424" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Check the connection, then retry.</text><g><rect x="638" y="479" width="132" height="36" rx="6" fill="#315f9b" stroke="#315f9b"/><text x="652" y="503" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Try again</text></g><g><rect x="784" y="479" width="160" height="36" rx="6" fill="#ffffff" stroke="#d8e0e5"/><text x="798" y="503" font-family="sans-serif" font-size="13" font-weight="600" fill="#23313b">Back to queue</text></g><rect x="56" y="611" width="530" height="78" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="72" y="636" font-family="sans-serif" font-size="13" font-weight="600" fill="#315f9b">Empty ≠ no matches</text><text x="72" y="662" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Filtered zero results need “Clear filters”.</text><rect x="614" y="611" width="530" height="78" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="630" y="636" font-family="sans-serif" font-size="13" font-weight="600" fill="#315f9b">Recovery is explicit</text><text x="630" y="662" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Retry keeps values; leaving needs draft policy.</text></g><line x1="56" y1="737" x2="1144" y2="737" stroke="#bdc4b6" stroke-width="1"/><text x="56" y="765" font-family="sans-serif" font-size="12" font-weight="400" fill="#545e55">Error copy is synthetic. Actual recovery, duplicate prevention and announcement behavior are unimplemented.</text><text x="1045" y="765" font-family="sans-serif" font-size="12" font-weight="600" fill="#545e55">INGENIUM</text></svg>
