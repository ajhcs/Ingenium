<svg id="wireflow-scene" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title id="wireflow-title">Wireflow</title><desc id="wireflow-description">Local valid edits, pending requests, matching acknowledgements and recoverable failure Subject R-1048: Bench lamp. Original synthetic Relay study. Editable source, not a working product.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f2f0e8" stroke="#f2f0e8"/><rect x="56" y="29" width="12" height="16" rx="0" fill="#e5ff55" stroke="#202824"/><text x="79" y="43" font-family="sans-serif" font-size="12" font-weight="600" fill="#202824">INGENIUM / RELAY STUDIES</text><g id="wireflow-subject-title"><title id="wireflow-subject-title-full">R-1048 / Bench lamp</title><text id="wireflow-subject-title-visible" x="560" y="43" font-family="sans-serif" font-size="12" font-weight="400" fill="#545e55">R-1048 / Bench lamp</text></g><line x1="56" y1="57" x2="1144" y2="57" stroke="#bdc4b6" stroke-width="1"/><text x="56" y="96" font-family="DejaVuSerif, Georgia, serif" font-size="34" font-weight="400" fill="#202824">Wireflow</text><text x="56" y="125" font-family="sans-serif" font-size="15" font-weight="400" fill="#545e55">Local valid edits, pending requests, matching acknowledgements and recoverable failure</text><g id="wireflow-view"><g id="wireflow-queue"><rect x="56" y="195" width="250" height="250" rx="8" fill="#ffffff" stroke="#d8e0e5"/><rect x="56" y="195" width="250" height="36" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="70" y="219" font-family="sans-serif" font-size="15" font-weight="600" fill="#23313b">01 / Queue · local change</text><rect x="70" y="245" width="222" height="91" rx="5" fill="#f5f7f8" stroke="#d8e0e5"/><text x="82" y="266" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">R-1048</text><g id="wireflow-queue-subject"><title id="wireflow-queue-subject-full">Bench lamp</title><text id="wireflow-queue-subject-visible" x="82" y="291" font-family="sans-serif" font-size="15" font-weight="600" fill="#23313b">Bench lamp</text></g><text x="82" y="317" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Mina Patel</text><text id="wireflow-queue-revision" x="72" y="357" font-family="sans-serif" font-size="12" font-weight="400" fill="#63727c">Working r2 · acknowledged r1</text><g id="wireflow-queue-action"><rect x="72" y="388" width="218" height="36" rx="6" fill="#315f9b" stroke="#315f9b"/><text x="86" y="412" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Open order</text></g></g><g id="wireflow-detail"><rect x="386" y="195" width="344" height="310" rx="8" fill="#ffffff" stroke="#d8e0e5"/><rect x="386" y="195" width="344" height="36" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="400" y="219" font-family="sans-serif" font-size="15" font-weight="600" fill="#23313b">02 / Assignment editor</text><g id="wireflow-detail-subject"><title id="wireflow-detail-subject-full">Bench lamp</title><text id="wireflow-detail-subject-visible" x="402" y="261" font-family="sans-serif" font-size="17" font-weight="600" fill="#23313b">Bench lamp</text></g><text x="402" y="286" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">ASSIGNEE</text><rect x="402" y="298" width="312" height="38" rx="5" fill="#ffffff" stroke="#d8e0e5"/><text x="416" y="322" font-family="sans-serif" font-size="15" font-weight="400" fill="#23313b">Mina Patel</text><text x="402" y="359" font-family="sans-serif" font-size="13" font-weight="600" fill="#15776d">Valid input → automatic local r2</text><text id="wireflow-detail-revision" x="402" y="386" font-family="sans-serif" font-size="12" font-weight="400" fill="#63727c">Working r2 · acknowledged r1</text><g id="wireflow-detail-action"><rect x="402" y="423" width="178" height="36" rx="6" fill="#315f9b" stroke="#315f9b"/><text x="416" y="447" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Save assignment</text></g><g id="wireflow-detail-cancel"><rect x="594" y="423" width="120" height="36" rx="6" fill="#ffffff" stroke="#d8e0e5"/><text x="608" y="447" font-family="sans-serif" font-size="13" font-weight="600" fill="#23313b">Cancel</text></g><g id="wireflow-edge-refuse"><text id="wireflow-refusal-label" x="402" y="485" font-family="sans-serif" font-size="12" font-weight="600" fill="#946018">If invalid: stay; choose a listed person.</text></g></g><g id="wireflow-pending"><rect x="810" y="195" width="334" height="270" rx="8" fill="#ffffff" stroke="#d8e0e5"/><rect x="810" y="195" width="334" height="36" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="824" y="219" font-family="sans-serif" font-size="15" font-weight="600" fill="#23313b">03 / Saving · request pending</text><text x="826" y="255" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">ASSIGNEE / RETAINED VALUE</text><rect x="826" y="268" width="302" height="38" rx="5" fill="#f5f7f8" stroke="#d8e0e5"/><text x="840" y="293" font-family="sans-serif" font-size="15" font-weight="400" fill="#23313b">Mina Patel</text><text id="wireflow-pending-revision" x="826" y="333" font-family="sans-serif" font-size="12" font-weight="400" fill="#63727c">Working r2 · acknowledged r1</text><text x="826" y="362" font-family="sans-serif" font-size="13" font-weight="600" fill="#23313b">Request ID: Qn / revision: r2</text><text x="826" y="388" font-family="sans-serif" font-size="13" font-weight="600" fill="#315f9b">Pending is not Saved.</text><g id="wireflow-pending-request"><rect x="826" y="410" width="302" height="34" rx="5" fill="#f5f7f8" stroke="#d8e0e5"/><text x="840" y="432" font-family="sans-serif" font-size="12" font-weight="400" fill="#63727c">Save pending · duplicate send unavailable</text></g></g><g id="wireflow-updated"><rect x="810" y="563" width="334" height="140" rx="8" fill="#ffffff" stroke="#d8e0e5"/><rect x="810" y="563" width="334" height="36" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="824" y="587" font-family="sans-serif" font-size="15" font-weight="600" fill="#23313b">04 / Queue · assignment saved</text><text x="826" y="621" font-family="sans-serif" font-size="14" font-weight="600" fill="#23313b">R-1048 · Mina Patel</text><text id="wireflow-updated-revision" x="826" y="642" font-family="sans-serif" font-size="12" font-weight="400" fill="#15776d">Working r2 · acknowledged r2</text><g id="wireflow-updated-action"><rect x="826" y="655" width="150" height="36" rx="6" fill="#ffffff" stroke="#d8e0e5"/><text x="840" y="679" font-family="sans-serif" font-size="13" font-weight="600" fill="#23313b">Open order</text></g></g><g id="wireflow-failed"><rect x="386" y="563" width="344" height="140" rx="8" fill="#ffffff" stroke="#d8e0e5"/><rect x="386" y="563" width="344" height="36" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="400" y="587" font-family="sans-serif" font-size="15" font-weight="600" fill="#23313b">05 / Editor · save failed</text><rect id="wireflow-failed-assignee" x="402" y="607" width="312" height="28" rx="4" fill="#f5f7f8" stroke="#d8e0e5"/><text x="416" y="627" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Mina Patel · retained</text><text id="wireflow-failed-revision" x="402" y="648" font-family="sans-serif" font-size="12" font-weight="400" fill="#946018">Working r2 · acknowledged r1 · not Saved</text><g id="wireflow-failed-action"><rect x="402" y="655" width="146" height="36" rx="6" fill="#ffffff" stroke="#d8e0e5"/><text x="416" y="679" font-family="sans-serif" font-size="13" font-weight="600" fill="#23313b">Try again</text></g></g><g id="wireflow-edge-open"><line x1="314" y1="324" x2="378" y2="324" stroke="#315f9b" stroke-width="2"/><polygon points="378,324 370.79642318117857,327.4797242728898 370.79642318117857,320.5202757271102" fill="#315f9b"/></g><text id="wireflow-open-label" x="320" y="302" font-family="sans-serif" font-size="12" font-weight="600" fill="#315f9b">Open</text><g id="wireflow-edge-submit"><line x1="738" y1="324" x2="802" y2="324" stroke="#315f9b" stroke-width="2"/><polygon points="802,324 794.7964231811786,327.4797242728898 794.7964231811786,320.5202757271102" fill="#315f9b"/></g><text id="wireflow-submit-label" x="748" y="282" font-family="sans-serif" font-size="12" font-weight="600" fill="#315f9b">Save</text><text id="wireflow-valid-input-label" x="738" y="303" font-family="sans-serif" font-size="11" font-weight="600" fill="#63727c">[valid r2]</text><g id="wireflow-edge-cancel"><line x1="378" y1="434" x2="314" y2="434" stroke="#315f9b" stroke-width="2"/><polygon points="314,434 321.20357681882143,430.5202757271102 321.20357681882143,437.4797242728898" fill="#315f9b"/></g><text id="wireflow-cancel-label" x="318" y="457" font-family="sans-serif" font-size="11" font-weight="600" fill="#315f9b">Cancel</text><text id="wireflow-cancel-guard-label" x="314" y="475" font-family="sans-serif" font-size="10" font-weight="600" fill="#63727c">before send</text><g id="wireflow-edge-assign"><line x1="1118" y1="473" x2="1118" y2="555" stroke="#15776d" stroke-width="2"/><polygon points="1118,555 1114.5202757271102,547.7964231811786 1121.4797242728898,547.7964231811786" fill="#15776d"/></g><text id="wireflow-save-event-label" x="826" y="494" font-family="sans-serif" font-size="12" font-weight="600" fill="#15776d">System ACK: Qn + r2</text><text id="wireflow-save-match-label" x="826" y="516" font-family="sans-serif" font-size="12" font-weight="600" fill="#15776d">[both match; still current]</text><g id="wireflow-edge-fail"><line x1="820" y1="473" x2="820" y2="529" stroke="#946018" stroke-width="2"/><line x1="820" y1="529" x2="794" y2="529" stroke="#946018" stroke-width="2"/><line x1="778" y1="529" x2="704" y2="529" stroke="#946018" stroke-width="2"/><g><line x1="704" y1="529" x2="704" y2="555" stroke="#946018" stroke-width="2"/><polygon points="704,555 700.5202757271102,547.7964231811786 707.4797242728898,547.7964231811786" fill="#946018"/></g></g><text id="wireflow-failure-label" x="386" y="548" font-family="sans-serif" font-size="12" font-weight="600" fill="#946018">Failure Qn / r2 → keep values; not Saved</text><g id="wireflow-edge-retry"><line x1="738" y1="670" x2="786" y2="670" stroke="#315f9b" stroke-width="2"/><line x1="786" y1="670" x2="786" y2="430" stroke="#315f9b" stroke-width="2"/><g><line x1="786" y1="430" x2="802" y2="430" stroke="#315f9b" stroke-width="2"/><polygon points="802,430 794.7964231811786,433.4797242728898 794.7964231811786,426.5202757271102" fill="#315f9b"/></g></g><text id="wireflow-retry-label" x="738" y="600" font-family="sans-serif" font-size="11" font-weight="600" fill="#315f9b">Retry</text><text id="wireflow-retry-request-label" x="738" y="618" font-family="sans-serif" font-size="10" font-weight="600" fill="#63727c">new Qn</text><rect x="56" y="563" width="250" height="140" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="72" y="588" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">SCOPE / STATIC ROUTES</text><text x="72" y="612" font-family="sans-serif" font-size="12" font-weight="400" fill="#23313b">Entry: local r2; durable r1.</text><text x="72" y="633" font-family="sans-serif" font-size="12" font-weight="400" fill="#23313b">Cancel: before send only.</text><text x="72" y="654" font-family="sans-serif" font-size="12" font-weight="400" fill="#23313b">Retry: new request each time.</text><text x="72" y="675" font-family="sans-serif" font-size="11" font-weight="400" fill="#63727c">No execution or retry-safety proof.</text></g><line x1="56" y1="737" x2="1144" y2="737" stroke="#bdc4b6" stroke-width="1"/><text x="56" y="765" font-family="sans-serif" font-size="12" font-weight="400" fill="#545e55">Static route specification; in-flight cancellation, API timing, concurrent edits and request safety are untested.</text><text x="1045" y="765" font-family="sans-serif" font-size="12" font-weight="600" fill="#545e55">INGENIUM</text></svg>
