ight="400" fill="#23313b">Single assignment path; no bulk actions.</text><rect x="428" y="621" width="344" height="78" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="444" y="646" font-family="sans-serif" font-size="13" font-weight="600" fill="#315f9b">Recovery</text><text x="444" y="672" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Invalid input retains entered values.</text><rect x="800" y="621" width="344" height="78" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="816" y="646" font-family="sans-serif" font-size="13" font-weight="600" fill="#315f9b">Arrow language</text><text x="816" y="672" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Blue: route; amber: in-place refusal.</text></g><line x1="56" y1="737" x2="1144" y2="737" stroke="#bdc4b6" stroke-width="1"/><text x="56" y="765" font-family="sans-serif" font-size="12" font-weight="400" fill="#545e55">Static route sketch; authentication, API timing and concurrent edits remain unspecified.</text><text x="1045" y="765" font-family="sans-serif" font-size="12" font-weight="600" fill="#545e55">INGENIUM</text></svg>
