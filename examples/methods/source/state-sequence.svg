<svg id="state-sequence-scene" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title id="state-sequence-title">Same-screen state sequence</title><desc id="state-sequence-description">One panel over time · invalid raw input never replaces the last valid working value Original synthetic Relay study. Editable source, not a working product.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f2f0e8" stroke="#f2f0e8"/><rect x="56" y="29" width="12" height="16" rx="0" fill="#e5ff55" stroke="#202824"/><text x="79" y="43" font-family="sans-serif" font-size="12" font-weight="600" fill="#202824">INGENIUM / RELAY STUDIES</text><text id="state-sequence-subject-title" x="560" y="43" font-family="sans-serif" font-size="12" font-weight="400" fill="#545e55">R-1048 / Bench lamp</text><line x1="56" y1="57" x2="1144" y2="57" stroke="#bdc4b6" stroke-width="1"/><text x="56" y="96" font-family="DejaVuSerif, Georgia, serif" font-size="34" font-weight="400" fill="#202824">Same-screen state sequence</text><text x="56" y="125" font-family="sans-serif" font-size="15" font-weight="400" fill="#545e55">One panel over time · invalid raw input never replaces the last valid working value</text><g id="state-sequence-view"><g id="state-sequence-invalid"><text x="56" y="175" font-family="sans-serif" font-size="13" font-weight="600" fill="#63727c">A / Invalid retained</text><rect id="state-sequence-invalid-panel" x="56" y="193" width="254" height="340" rx="10" fill="#ffffff" stroke="#d8e0e5"/><text x="72" y="225" font-family="sans-serif" font-size="16" font-weight="600" fill="#23313b">R-1048 / Assignment</text><text x="72" y="263" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">ASSIGNEE</text><rect id="state-sequence-invalid-assignee" x="72" y="277" width="222" height="42" rx="6" fill="#f5f7f8" stroke="#d8e0e5"/><text x="84" y="304" font-family="sans-serif" font-size="15" font-weight="400" fill="#23313b">Mina?</text><text x="72" 