ll="#63727c">Acknowledged: r1 / Unassigned</text><text id="state-sequence-repaired-action" x="350" y="503" font-family="sans-serif" font-size="12" font-weight="600" fill="#315f9b">Automatic update</text></g><g id="state-sequence-applied"><text x="612" y="175" font-family="sans-serif" font-size="13" font-weight="600" fill="#63727c">C / Applied locally</text><rect id="state-sequence-applied-panel" x="612" y="193" width="254" height="340" rx="10" fill="#ffffff" stroke="#d8e0e5"/><text x="628" y="225" font-family="sans-serif" font-size="16" font-weight="600" fill="#23313b">R-1048 / Assignment</text><text x="628" y="263" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">ASSIGNEE</text><rect id="state-sequence-applied-assignee" x="628" y="277" width="222" height="42" rx="6" fill="#f5f7f8" stroke="#d8e0e5"/><text x="640" y="304" font-family="sans-serif" font-size="15" font-weight="400" fill="#23313b">Mina Patel</text><text x="628" y="346" font-family="sans-serif" font-size="12" font-weight="400" fill="#63727c">No active raw draft</text><rect x="628" y="364" width="222" height="45" rx="6" fill="#eaf0f9" stroke="#eaf0f9"/><text x="640" y="392" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Local value · unsaved.</text><text x="628" y="437" font-family="sans-serif" font-size="12" font-weight="400" fill="#23313b">Working: r2 / Mina Patel</text><text x="628" y="461" font-family="sans-serif" font-size="11" font-weight="400" fill="#63727c">Acknowledged: r1 / Unassigned</text><text id="state-sequence-applied-action" x="628" y="503" font-family="sans-serif" font-size="12" font-weight="600" fill="#315f9b">Undo assignment</text></g><g id="state-sequence-undone"><text x="890" y="175" font-family="sans-serif" font-size="13" font-weight="600" fill="#63727c">D / Model undo</text><rect id="state-sequence-undone-panel" x="890" y="193" width="254" height="340" rx="10" fill="#ffffff" stroke="#d8e0e5"/><text x="906" y="225" font-family="sans-serif" font-size="16" font-weight="600" fill="#23313b">R-1048 / Assignment</text><text x="906" y="263" font-family="sans-serif" font-size="12" font-weight="600" fill="#63727c">ASSIGNEE</text><rect id="state-sequence-undone-assignee" x="906" y="277" width="222" height="42" rx="6" fill="#f5f7f8" stroke="#d8e0e5"/><text x="918" y="304" font-family="sans-serif" font-size="15" font-weight="400" fill="#23313b">Unassigned</text><text x="906" y="346" font-family="sans-serif" font-size="12" font-weight="400" fill="#63727c">No active raw draft</text><rect x="906" y="364" width="222" height="45" rx="6" fill="#eaf0f9" stroke="#eaf0f9"/><text x="918" y="392" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Prior value → NEW r3.</text><text x="906" y="437" font-family="sans-serif" font-size="12" font-weight="400" fill="#23313b">Working: r3 / Unassigned</text><text x="906" y="461" font-family="sans-serif" font-size="11" font-weight="400" fill="#63727c">Acknowledged: r1 / Unassigned</text><text id="state-sequence-undone-action" x="906" y="503" font-family="sans-serif" font-size="12" font-weight="600" fill="#315f9b">Undo is not text undo</text></g><text x="56" y="568" font-family="sans-serif" font-size="15" font-weight="600" fill="#315f9b">Repair valid input → automatic model update → close draft → model Undo creates r3</text><rect x="56" y="610" width="344" height="78" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="72" y="635" font-family="sans-serif" font-size="13" font-weight="600" fill="#315f9b">Changes / same panel anchors</text><text x="72" y="661" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Raw value, working value and revision.</text><rect x="428" y="610" width="344" height="78" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="444" y="635" font-family="sans-serif" font-size="13" font-weight="600" fill="#315f9b">Unchanged / all four snapshots</text><text x="444" y="661" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Subject R-1048; durable acknowledgement r1.</text><rect x="800" y="610" width="344" height="78" rx="8" fill="#eaf0f9" stroke="#eaf0f9"/><text x="816" y="635" font-family="sans-serif" font-size="13" font-weight="600" fill="#315f9b">Undo scope / explicit precondition</text><text x="816" y="661" font-family="sans-serif" font-size="13" font-weight="400" fill="#23313b">Resolve raw draft first; never rewind revision.</text></g><line x1="56" y1="737" x2="1144" y2="737" stroke="#bdc4b6" stroke-width="1"/><text x="56" y="765" font-family="sans-serif" font-size="12" font-weight="400" fill="#545e55">Static automatic-update policy; no persistence, timing, focus or receipt rejection executed.</text><text x="1045" y="765" font-family="sans-serif" font-size="12" font-weight="600" fill="#545e55">INGENIUM</text></svg>
